# Catppuccin Frappe, matching the waybar/i3 bar palette (env/i3/config has
# the full color set as comments). Hand-edited, symlinked in via
# home-manager -- fuzzel re-reads this file on each launch, no restart needed.

[main]
font=JetBrainsMono Nerd Font:size=11
dpi-aware=auto
lines=8
width=40
horizontal-pad=24
vertical-pad=12
inner-pad=8

[colors]
background=292c3cf2    # mantle
text=c6d0f5ff          # text
prompt=8caaeeff        # blue
placeholder=737994ff   # overlay0
input=c6d0f5ff         # text
match=8caaeeff         # blue
selection=51576dff     # surface1
selection-text=c6d0f5ff        # text
selection-match=babbf1ff       # lavender
counter=737994ff       # overlay0
border=626880ff        # surface2

[border]
width=2
radius=8
selection-radius=4
